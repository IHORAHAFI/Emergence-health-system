name: Keep Render backend awake

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (Render free services sleep after 15)
  workflow_dispatch:          # allows a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping backend
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 https://ai-medical-emergency.onrender.com/api/)
          echo "Backend answered HTTP $code"
