{% extends "dashboard/base.html" %}
{% block title %}Bed capacity{% endblock %}
{% block page_title %}Update bed capacity{% endblock %}
{% block content %}
<div class="col-md-4"><div class="card"><div class="card-body">
  <h2 class="h4">{{ h.name }} — capacity</h2>
  <form method="post">{% csrf_token %}
    <label>Available beds</label><input class="form-control mb-2" type="number" min="0" name="available_beds" value="{{ h.available_beds }}">
    <label>ICU beds available</label><input class="form-control mb-2" type="number" min="0" name="icu_available" value="{{ h.icu_available }}">
    <div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="has_emergency_unit" {% if h.has_emergency_unit %}checked{% endif %}>
      <label class="form-check-label">Emergency unit accepting patients</label></div>
    <button class="btn btn-danger">Save</button>
  </form>
</div></div></div>
{% endblock %}
