{% if page.paginator.num_pages > 1 %}
<nav class="mt-2"><ul class="pagination pagination-sm">
  {% if page.has_previous %}<li class="page-item"><a class="page-link" href="?{% if params %}{{ params }}&{% elif request.GET.channel %}channel={{ request.GET.channel }}&{% endif %}page={{ page.previous_page_number }}">&laquo; Prev</a></li>{% endif %}
  <li class="page-item disabled"><span class="page-link">Page {{ page.number }} of {{ page.paginator.num_pages }}</span></li>
  {% if page.has_next %}<li class="page-item"><a class="page-link" href="?{% if params %}{{ params }}&{% elif request.GET.channel %}channel={{ request.GET.channel }}&{% endif %}page={{ page.next_page_number }}">Next &raquo;</a></li>{% endif %}
</ul></nav>
{% endif %}
