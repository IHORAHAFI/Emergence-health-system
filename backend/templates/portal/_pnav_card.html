{# One service card. Params: href, icon, title, desc, badge (optional count), red (badge colour) #}<a class="pnav-card" href="{{ href }}"><i class="bi {{ icon }}" aria-hidden="true"></i><span class="pnav-text"><span class="pnav-title">{{ title }}</span><span class="pnav-desc">{{ desc }}</span></span>{% if badge %}<span class="pnav-badge{% if red %} red{% endif %}">{{ badge }}<span class="visually-hidden"> new</span></span>{% endif %}</a>
