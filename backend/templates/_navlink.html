{# Sidebar link. Params: href, icon, label, names ("|a|b|" url names that make it active), cls, badge, badge_attr #}
{% with key="|"|add:current|add:"|" %}<a class="nav-link {{ cls }}{% if key in names %} active{% endif %}" href="{{ href }}"{% if key in names %} aria-current="page"{% endif %}><i class="bi {{ icon }}" aria-hidden="true"></i> <span>{{ label }}</span>{% if badge_attr %} <span class="badge rounded-pill bg-danger{% if not badge %} d-none{% endif %}" {{ badge_attr }}>{{ badge }}</span>{% elif badge %} <span class="badge rounded-pill bg-danger">{{ badge }}<span class="visually-hidden"> new</span></span>{% endif %}</a>{% endwith %}
