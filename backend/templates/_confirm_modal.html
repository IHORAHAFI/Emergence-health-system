{% load i18n %}
{# One accessible confirmation dialog for every destructive action: add data-confirm="Question?" to a form or button. #}
<div class="modal fade" id="confirm-modal" tabindex="-1" aria-labelledby="confirm-title" aria-describedby="confirm-text" aria-modal="true" role="dialog">
  <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
    <div class="modal-header"><h2 class="modal-title h5" id="confirm-title">{% translate "Please confirm" %}</h2>
      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{% translate 'Close' %}"></button></div>
    <div class="modal-body"><p id="confirm-text" class="mb-0"></p></div>
    <div class="modal-footer">
      <button type="button" class="btn btn-light" data-bs-dismiss="modal">{% translate "No, go back" %}</button>
      <button type="button" class="btn btn-danger" id="confirm-yes">{% translate "Yes, continue" %}</button>
    </div>
  </div></div>
</div>
