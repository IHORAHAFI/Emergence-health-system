<div class="mb-3">
  {% if f.widget_type == 'checkbox' %}
  <div class="form-check">{{ f }} <label class="form-check-label" for="{{ f.id_for_label }}">{{ f.label }}</label></div>
  {% elif f.widget_type == 'checkboxselectmultiple' %}
  <fieldset><legend class="form-label fs-6">{{ f.label }}</legend>
  <div class="row g-1">{% for c in f %}<div class="col-6 col-md-4"><div class="form-check">{{ c.tag }} <label class="form-check-label" for="{{ c.id_for_label }}">{{ c.choice_label }}</label></div></div>{% endfor %}</div></fieldset>
  {% else %}
  <label class="form-label" for="{{ f.id_for_label }}">{{ f.label }}{% if f.field.required %} <span class="text-danger" aria-hidden="true">*</span><span class="visually-hidden">(required)</span>{% endif %}</label>
  {{ f }}
  {% endif %}
  {% if f.help_text %}<div class="form-text" id="{{ f.auto_id }}_helptext">{{ f.help_text|safe }}</div>{% endif %}
  {% for e in f.errors %}<div class="text-danger small" role="alert"><i class="bi bi-exclamation-circle-fill" aria-hidden="true"></i> {{ e }}</div>{% endfor %}
</div>
