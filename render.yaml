services:
  - type: web
    name: ai-medical-emergency
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: ai-medical-db
          property: connectionString
  - type: web
    name: ai-medical-emergency-app
    runtime: static
    rootDir: mobile_app
    buildCommand: rm -rf $HOME/flutter && git clone --depth 1 -b stable https://github.com/flutter/flutter.git $HOME/flutter && $HOME/flutter/bin/flutter config --enable-web && $HOME/flutter/bin/flutter pub get && $HOME/flutter/bin/flutter build web --release --dart-define=API_URL=https://ai-medical-emergency.onrender.com/api
    staticPublishPath: build/web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
databases:
  - name: ai-medical-db
    plan: free
